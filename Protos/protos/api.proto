syntax = "proto3";

package google.protobuf;

import "enum.proto";
import "struct.proto";

option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.WellKnownTypes";
option go_package = "gameframework/server/pb/apipb;apipb";


message MonsterInfoReq {
  int32 id = 1;
}


message MonsterInfoAck{
  MonsterData data = 1;
}


message ServerPublicKey{
  string key = 1;
}

message ClientAesKey{
  string key = 1;
}


// ===== 登录 / 心跳 =====

message LoginReq {
  string account = 1;
  string password = 2;
}

message LoginAck {
  // 0=成功 1=参数错误 2=密码错误 3=账号已在别处登录 4=服务器错误
  int32 code = 1;
  string message = 2;
  uint64 playerId = 3;
  string token = 4;
  int64 serverTime = 5; // 服务器毫秒时间戳
  Vec3 spawnPos = 6;    // 玩家出生点（脚底坐标）
  float spawnRotationY = 7;
}

// ===== 寻路 / 移动同步 =====

message PathFindReq {
  uint32 seq = 1;
  Vec3 target = 2;     // 点击的目标点
  Vec3 clientPos = 3;  // 仅用于偏差检测，服务端以自己维护的位置为准
}

message PathFindAck {
  uint32 seq = 1;
  // 0=成功 1=未登录 2=目标无效 3=不可达 4=服务器错误
  int32 code = 2;
  string message = 3;
  uint32 pathId = 4;
  repeated Vec3 corners = 5; // 服务端权威路径
  Vec3 start = 6;            // 服务端吸附后的起点
  float speed = 7;           // 移动速度
}

message MoveSync {
  uint64 playerId = 1;
  uint32 pathId = 2;
  Vec3 position = 3; // 脚底坐标
  float rotationY = 4;
  bool moving = 5;
  int32 cornerIndex = 6;
}

// ===== 移动速度 =====

message SetMoveSpeedReq {
  float speed = 1;
}

message SetMoveSpeedSync {
  uint64 playerId = 1;
  float speed = 2;
  // 0=成功 1=速度非法 2=未登录
  int32 code = 3;
}

// ===== 关卡门（动态障碍物）=====

message GateStateQueryReq {
}

message GateStateReq {
  int32 gateId = 1;
  bool open = 2;
}

message GateStateSync {
  int32 gateId = 1;
  bool open = 2;
  // 0=成功 1=关卡不存在 2=未登录
  int32 code = 3;
  Vec3 center = 4;   // 关卡门世界中心
  Vec3 size = 5;     // 关卡门世界尺寸
  float rotationY = 6;
}

// ===== 建筑关卡通行权限 =====

message GateInfoReq {
  string instanceId = 1;
}

message GatePlayerInfo {
  uint64 playerId = 1;
}

message GateInfoAck {
  // 0=成功 1=关卡不存在 2=不是关卡 3=未登录
  int32 code = 1;
  string instanceId = 2;
  uint64 ownerPlayerId = 3;
  bool isOwner = 4;
  repeated GatePlayerInfo allowedPlayers = 5;
  repeated GatePlayerInfo pendingRequests = 6;
  // 0=无 1=待审批 2=已通过 3=已拒绝 4=归属人 5=未归属（禁止通行）
  int32 myStatus = 7;
  string message = 8;
}

message GateApplyReq {
  string instanceId = 1;
}

message GateApplyAck {
  int32 code = 1;
  string instanceId = 2;
  int32 status = 3;
  string message = 4;
}

message GateApproveReq {
  string instanceId = 1;
  uint64 playerId = 2;
}

message GateApproveAck {
  int32 code = 1;
  string instanceId = 2;
  string message = 3;
}

message GateRemoveAccessReq {
  string instanceId = 1;
  uint64 playerId = 2;
}

message GateRemoveAccessAck {
  int32 code = 1;
  string instanceId = 2;
  string message = 3;
}

message GateClaimReq {
  string instanceId = 1;
}

message GateClaimAck {
  int32 code = 1;
  string instanceId = 2;
  string message = 3;
}

message GateAccessSync {
  int32 code = 1;
  string instanceId = 2;
  uint64 ownerPlayerId = 3;
  repeated GatePlayerInfo allowedPlayers = 4;
  repeated GatePlayerInfo pendingRequests = 5;
  int32 myStatus = 6;
  string message = 7;
}

message HeartBeatReq {
  int64 clientTime = 1; // 客户端毫秒时间戳
}

message HeartBeatAck {
  int64 clientTime = 1;
  int64 serverTime = 2;
}