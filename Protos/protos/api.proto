syntax = "proto3";

package google.protobuf;

import "enum.proto";
import "struct.proto";

option objc_class_prefix = "GPB";
option csharp_namespace = "Google.Protobuf.WellKnownTypes";
option go_package = "gameframework/server/pb/apipb;apipb";


message MonsterInfoReq {
  int32 id = 1;
}


message MonsterInfoAck{
  MonsterData data = 1;
}


message ServerPublicKey{
  string key = 1;
}

message ClientAesKey{
  string key = 1;
}


// ===== 登录 / 心跳 =====

message LoginReq {
  string account = 1;
  string password = 2;
}

message LoginAck {
  // 0=成功 1=参数错误 2=密码错误 3=账号已在别处登录 4=服务器错误
  int32 code = 1;
  string message = 2;
  uint64 playerId = 3;
  string token = 4;
  int64 serverTime = 5; // 服务器毫秒时间戳
}

message HeartBeatReq {
  int64 clientTime = 1; // 客户端毫秒时间戳
}

message HeartBeatAck {
  int64 clientTime = 1;
  int64 serverTime = 2;
}